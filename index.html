<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12203D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mamelon Lab · تطبيق المندوب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=Cairo:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="html5-qrcode.min.js"></script>
  <style>
    :root {
      --navy: #12203D;
      --navy-2: #1B2E52;
      --gold: #C9A227;
      --gold-2: #E0BC4A;
      --bg: #F5F6F8;
      --card: #FFFFFF;
      --ink: #1A1F29;
      --ink-soft: #6B7280;
      --line: #E7E9EE;
      --green: #1F8A55;
      --green-bg: #EAF7EF;
      --red: #C1443C;
      --red-bg: #FDEEEC;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      position: relative;
    }

    body {
      background: var(--bg);
      font-family: 'Cairo', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      padding: 16px 16px 18px;
      color: #fff;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 85% -20%, rgba(201, 162, 39, 0.35), transparent 55%);
    }

    .headrow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: .4px;
      color: var(--gold-2);
    }

    .brand .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
    }

    .logout-btn {
      background: rgba(255, 255, 255, .12);
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
    }

    h1 {
      font-family: 'Tajawal', sans-serif;
      font-weight: 900;
      font-size: 20px;
      margin: 8px 0 2px;
      position: relative;
      z-index: 1;
    }

    .sub {
      font-size: 12px;
      color: #B9C4DA;
      position: relative;
      z-index: 1;
    }

    /* رقم الإصدار ظاهر للمندوب: بلا خطوة بناء ولا service worker، الطريقة الوحيدة
       ليتأكد أنه يشغّل النسخة الجديدة بعد النشر (وأن الـWebView ما خدمهوش من الكاش)
       هي أن يقرأه بعينه ويقوله لنا. */
    .app-version {
      text-align: center;
      margin-top: 14px;
      font-size: 11px;
      color: #7C8AA5;
      letter-spacing: .3px;
    }

    main {
      flex: 1;
      padding: 12px 12px 90px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .screen {
      display: none;
      width: 100%;
    }

    .screen.show {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-bottom: 4px;
    }

    .dash-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .03);
    }

    .dash-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 2px;
    }

    .dash-value {
      font-family: 'Tajawal', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--navy);
    }

    .dash-value.gold {
      color: var(--gold);
    }

    .dash-value.green {
      color: var(--green);
    }

    .dash-value.red {
      color: var(--red);
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 1px 3px rgba(18, 32, 61, 0.06);
      border: 1px solid var(--line);
      width: 100%;
    }

    .field-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 8px;
      display: block;
    }

    .pin-input {
      width: 100%;
      font-family: 'Tajawal', sans-serif;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 8px;
      padding: 14px 10px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--bg);
      color: var(--navy);
      direction: ltr;
      outline: none;
    }

    .pin-input:focus {
      border-color: var(--gold);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--navy);
    }

    .btn-dark {
      background: var(--navy);
      color: #fff;
    }

    .btn-green {
      background: var(--green-bg);
      color: var(--green);
    }

    .btn-red {
      background: var(--red-bg);
      color: var(--red);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-soft);
      border: 1.5px solid var(--line);
    }

    .btn-sm {
      padding: 8px 10px;
      font-size: 12.5px;
      border-radius: 8px;
      width: auto;
      flex: 1;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .banner {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .banner.show {
      display: flex;
    }

    .banner.error {
      background: var(--red-bg);
      color: var(--red);
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--card);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--line);
      width: 100%;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px 4px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      color: var(--ink-soft);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: var(--navy);
      color: #fff;
    }

    .tab .badge {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      font-size: 9px;
      font-weight: 900;
      border-radius: 6px;
      padding: 0px 4px;
      margin-right: 2px;
    }

    .search-box {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-bottom: 10px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid var(--line);
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      outline: none;
      font-family: 'Tajawal', sans-serif;
      color: var(--navy);
      background: var(--card);
    }

    .search-input:focus {
      border-color: var(--gold);
    }

    .search-btn {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 0 14px;
      border-radius: 10px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 13px;
    }

    .scan-btn {
      background: var(--gold);
      color: var(--navy);
      border: none;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .scanner-container {
      width: 100% !important;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--gold);
      display: none;
      margin-bottom: 12px;
      background: #000;
    }

    .scanner-container video,
    .scanner-container canvas {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    /* شريط وضع المسح المتتالي — عدّاد + زر إنهاء في متناول الإبهام */
    .scan-mode-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--navy);
      color: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .scan-mode-bar.show {
      display: flex;
    }

    .scan-mode-bar .btn-sm {
      flex: 0 0 auto;
    }

    /* إشعار غير معطِّل — بديل alert() الذي يوقف تدفق المسح المتتالي */
    .scan-toast {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      max-width: 92%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: var(--navy);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .18s;
      text-align: center;
    }

    .scan-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .scan-toast.ok {
      background: var(--green);
    }

    .scan-toast.warn {
      background: var(--gold);
      color: var(--navy);
    }

    .scan-toast.bad {
      background: var(--red);
    }

    .empty-state {
      text-align: center;
      padding: 30px 12px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.5;
    }

    .case-item {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      margin-bottom: 8px;
      width: 100%;
      transition: all .2s;
    }

    .case-item.highlight {
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(201, 162, 39, 0.4);
    }

    .case-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .case-num {
      font-family: 'Tajawal', sans-serif;
      font-weight: 900;
      font-size: 14.5px;
      color: var(--navy);
    }

    .case-clinic {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    /* شارات السلة: انحراف حالة المعمل (7.1) ومدة بقاء الحالة مع المندوب (7.2) */
    .case-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .case-badge {
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 12px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .case-badge.warn {
      background: var(--red-bg);
      color: var(--red);
      border-color: rgba(193, 68, 60, .3);
    }

    .case-badge.age-fresh {
      background: var(--green-bg);
      color: var(--green);
      border-color: rgba(31, 138, 85, .25);
    }

    .case-badge.age-mid {
      background: #FFF6E0;
      color: #8A6A0B;
      border-color: rgba(201, 162, 39, .35);
    }

    .case-badge.age-old {
      background: var(--red-bg);
      color: var(--red);
      border-color: rgba(193, 68, 60, .3);
    }

    /* شريط وضع اللااتصال فوق السلة (7.5) */
    .offline-note {
      background: #FFF6E0;
      border: 1px solid rgba(201, 162, 39, .45);
      color: #8A6A0B;
      font-size: 12px;
      font-weight: 700;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      text-align: center;
    }

    /* العنصر المعروض من نسخة محفوظة: للعرض فقط، بلا أفعال */
    .case-item.readonly .case-actions,
    .case-item.readonly .item-actions-right,
    .case-item.readonly .product-picker {
      display: none;
    }

    .item-actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remove-case-btn {
      background: var(--red-bg);
      color: var(--red);
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--line);
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .checkbox.checked {
      background: var(--gold);
      border-color: var(--gold);
    }

    .checkbox.checked::after {
      content: "✓";
      color: var(--navy);
      font-weight: 900;
      font-size: 13px;
    }

    .checkbox.disabled {
      opacity: .35;
      pointer-events: none;
    }

    .clinic-header {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--navy);
      background: #FFF9E9;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 12px 0 6px;
    }

    .case-products {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .chip {
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 2px 7px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
    }

    .case-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .sticky-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 20px));
      display: none;
      z-index: 10;
      box-shadow: 0 -4px 12px rgba(0, 0, 0, .05);
    }

    .sticky-bar.show {
      display: block;
    }

    .sticky-bar-inner {
      max-width: 480px;
      margin: 0 auto;
    }

    .deliver-form {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }

    .deliver-form.show {
      display: block;
    }

    /* شبكة 3×2 بدل flex-wrap: مع ستة منتجات (بعد إضافة Cast) كان العنصر السادس
       يلتف وحده ويتمدد بعرض الصف كاملاً لأن `flex:1` يملأ ما تبقى — شكل مشوَّه
       وهدف لمس ضخم بلا سبب. الشبكة تعطي ستة أزرار متساوية في صفّين.
       نفس الصنف يخدم شرائح خطورة البلاغ الثلاث فتملأ صفاً واحداً تماماً. */
    .product-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }

    .product-chip {
      text-align: center;
      padding: 8px 4px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      background: var(--bg);
      font-weight: 700;
      font-size: 11px;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .product-chip.active {
      border-color: var(--gold);
      background: #FFF9E9;
      color: var(--navy);
    }

    .text-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      background: var(--bg);
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      color: var(--ink);
      outline: none;
      margin-bottom: 8px;
      resize: none;
    }

    .text-input:focus {
      border-color: var(--gold);
    }

    .return-form {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }

    .return-form.show {
      display: block;
    }

    footer {
      text-align: center;
      font-size: 10.5px;
      color: #9AA3B2;
      padding: 4px 12px 8px;
    }
  </style>
</head>

<body>

  <header>
    <div class="headrow">
      <div class="brand"><span class="dot"></span>MAMELON LAB</div>
      <div style="display:flex; gap:6px;">
        <button class="logout-btn" id="bugBtn" style="display:none">🐞 بلّغ</button>
        <button class="logout-btn" id="logoutBtn" style="display:none">تسجيل خروج</button>
      </div>
    </div>
    <h1 id="headerTitle">تطبيق المندوب</h1>
    <div class="sub" id="headerSub">سجّل دخولك بالـ PIN بتاعك</div>
  </header>

  <main>

    <div class="screen show" id="loginScreen">
      <div class="card">
        <label class="field-label">رقم الـ PIN</label>
        <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
        <div style="height:10px"></div>
        <button class="btn btn-dark" id="loginBtn"><span id="loginBtnText">دخول</span></button>
        <div class="banner error" id="loginError"></div>
      </div>
      <div class="app-version" id="appVersion"></div>
    </div>

    <div class="screen" id="homeScreen">

      <!-- نموذج البلاغ (7.3) — يُدرج صفاً في bug_reports الجاهز أصلاً في القاعدة -->
      <div class="card" id="bugPanel" style="display:none;">
        <label class="field-label">🐞 بلّغ عن مشكلة</label>
        <!-- القيم إنجليزية عمداً: جدول bug_reports مشترك مع mamelon-erp الذي يكتب
             normal/important/blocking، وأي قيمة عربية هنا كانت ستشذّ عن مفردات الجدول. -->
        <div class="product-picker" id="bugSeverityPicker">
          <div class="product-chip active" data-severity="normal">🟢 عادي</div>
          <div class="product-chip" data-severity="important">🟡 مهم</div>
          <div class="product-chip" data-severity="blocking">🔴 يوقف العمل</div>
        </div>
        <div style="height:8px"></div>
        <textarea id="bugDescInput" class="text-input" maxlength="500" style="min-height:80px;"
          placeholder="اكتب المشكلة بالتفصيل: إيه اللي حصل وإنت بتعمل إيه؟ *"></textarea>
        <div class="banner" id="bugMsg"></div>
        <div style="height:8px"></div>
        <button class="btn btn-primary btn-sm" id="bugSendBtn" disabled>إرسال البلاغ</button>
        <div style="height:6px"></div>
        <button class="btn btn-ghost btn-sm" id="bugCancelBtn">إلغاء</button>
      </div>

      <div class="dashboard-grid">
        <div class="dash-card">
          <div class="dash-title">في السلة</div>
          <div class="dash-value gold" id="dashCart">0</div>
        </div>
        <div class="dash-card">
          <div class="dash-title">تسليم اليوم</div>
          <div class="dash-value green" id="dashDelivered">0</div>
        </div>
        <div class="dash-card">
          <div class="dash-title">مرجعة</div>
          <div class="dash-value red" id="dashReturned">0</div>
        </div>
      </div>

      <div class="tabs">
        <div class="tab active" id="tabAvailable">البحث</div>
        <div class="tab" id="tabCart">سلتي <span class="badge" id="cartCount">0</span></div>
        <div class="tab" id="tabReturned">مرجعة <span class="badge" id="returnedCount">0</span></div>
        <div class="tab" id="tabToday">اليوم <span class="badge" id="todayCount">0</span></div>
      </div>

      <!-- تبويب البحث -->
      <div id="availableContainer">
        <div class="card">
          <div class="search-box">

    async function writeJson(url, method, body) {

    // الحل الذي يوصي به PostgREST: إحاطة كل قيمة بعلامتَي اقتباس مزدوجتين — عندها

    function inFilterList(values) {

    // شبكة أمان لتحرير الكاميرا: html5-qrcode يوقف مسارات الفيديو داخلياً عند نجاح

    // — وإلا يفضل مؤشر الكاميرا شغّالاً وتُستهلك البطارية بلا أي وسيلة لإيقافه.
    function releaseVideoTracks(el) {
      el.querySelectorAll('video').forEach(v => {
        const stream = v.srcObject;
        if (stream && typeof stream.getTracks === 'function') {
          stream.getTracks().forEach(t => { try { t.stop(); } catch (e) { } });

        v.srcObject = null;
      });

    let scanSessionCount = 0;

    const SCAN_COOLDOWN_MS = 2500;

    let toastTimer = null;
    function showScanToast(text, tone) {
      scanToast.textContent = text;
      scanToast.className = 'scan-toast show' + (tone ? ' ' + tone : '');

    // تأكيد لمسي: المندوب ماسك العلبة وعينه عليها لا على الشاشة، فمن غير اهتزاز
    // ما يعرفش إن المسح اتسجّل أصلاً — وده أهم عنصر يخلي المسح المتتالي عملياً.
    function scanVibrate(ok) {
      try { if (navigator.vibrate) navigator.vibrate(ok ? 60 : [40, 60, 40]); } catch (e) { }
    }

    function showScanModeBar() {
      scanSessionCount = 0;
      scanCountEl.textContent = '0';

    async function handleContinuousScan(code) {
      const now = Date.now();
      // html5-qrcode ينادي الـ callback ~10 مرات/ثانية طول ما الباركود في المشهد.
      // بدون هذين الحارسين تتكرر نفس العلبة عشرات المرات ويُغرَق السيرفر بطلبات
      // متطابقة — الحارس الأول يمنع التداخل أثناء نداء جارٍ، والثاني يمنع إعادة
      // قراءة نفس الكود قبل مرور فترة تهدئة.
      if (scanBusy) return;
      if (code === lastScan.code && now - lastScan.at < SCAN_COOLDOWN_MS) return;
      lastScan = { code, at: now };
      scanBusy = true;
      try {
        const r = await lookupAndStageCase(code);
        if (r.status === 'added') {
          scanSessionCount++;
          scanCountEl.textContent = scanSessionCount;
          showScanToast(`✅ ${code} — اتضافت`, 'ok');
          scanVibrate(true);
        } else if (r.status === 'already_staged') {
          showScanToast(`ℹ️ ${code} — متضافة قبل كده`, 'warn');
        } else if (r.status === 'already_mine') {
          showScanToast(`⚠️ ${code} — في سلتك بالفعل`, 'warn');
          scanVibrate(false);
        } else if (r.status === 'held_by_other') {
          showScanToast(`🚫 ${code} — مع المندوب ${r.holder}`, 'bad');
          scanVibrate(false);
        } else {
          showScanToast(`❌ مفيش حالة برقم ${code}`, 'bad');
          scanVibrate(false);
        }
      } catch (e) {
        showScanToast('⚠️ مشكلة في الاتصال', 'bad');
        scanVibrate(false);
      } finally {
        scanBusy = false;
      }
    }

    async function startScanner(containerId, callback, options = {}) {
      const continuous = options.continuous === true;
      const el = scannerElement(containerId);
      if (el.style.display === 'block') { await stopAnyScanner(); return; }
      // انتظار الإغلاق الفعلي لأي ماسح سابق قبل فتح كاميرا جديدة. بدون await كانت
      // الكاميرا الجديدة تُفتح والقديمة لسه بتتقفل، فيشتغل ستريمان معاً لوهلة —
      // ومع تكرار المسح في نفس الجلسة يتراكم الاستهلاك ويظهر كتجمّد تدريجي.
      await stopAnyScanner();
      el.style.display = 'block';
      if (continuous) showScanModeBar();
      const scanner = new Html5Qrcode(el.id);
      scannerInstances[containerId] = scanner;
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 160 } },
        // في الوضع المتتالي الكاميرا تفضل شغّالة بعد كل قراءة، والإغلاق يدوي
        // (زر "تم" أو زر الكاميرا) — الحارسان جوه handleContinuousScan يمنعا التكرار.
        (decodedText) => {
          callback(decodedText);
          if (!continuous) stopScanner(containerId);
        },
        (error) => { }
      ).catch(() => {
        alert("تعذر فتح الكاميرا، تأكد من إعطاء صلاحية الوصول للكاميرا للمتصفح.");
        // لازم يُشال من السجل هنا كمان: ماسح فشل بدؤه يفضل مسجَّلاً بلا نشاط،
        // فيضيع handle بتاعه لما يكتب startScanner التالي فوقه.
        delete scannerInstances[containerId];
        releaseVideoTracks(el);
        el.style.display = 'none';
      });
    }

    function stopScanner(containerId) {
      const el = scannerElement(containerId);
      const scanner = scannerInstances[containerId];
      // الحذف من السجل يقع في كل المسارات (نجاح الإيقاف، فشله، أو ماسح غير نشط):
      // startScanner يكتب فوق scannerInstances[containerId] دائماً، فأي إدخال قديم
      // متروك يضيع handle كاميرته للأبد وتفضل شغّالة تحت كاميرا جديدة فوقها.
      delete scannerInstances[containerId];
      const finish = () => { releaseVideoTracks(el); el.style.display = 'none'; hideScanModeBar(); };
      if (scanner && scanner.isScanning) {
        return scanner.stop().catch(() => { }).then(finish);
      }
      finish();
      return Promise.resolve();
    }

    // يرجّع وعداً يكتمل بعد إغلاق كل الماسحات فعلياً — لازم لانتظاره في startScanner
    function stopAnyScanner() {
      return Promise.all(Object.keys(scannerInstances).map(key => stopScanner(key)));
    }

    // إغلاق الكاميرا عند تصغير التطبيق أو مغادرة الصفحة (بما فيه زر «رجوع» بالأندرويد).
    // بدون هذا كانت الكاميرا تفضل شغّالة في الخلفية — وهو الظرف الذي يسحب فيه النظام
    // مورد الكاميرا من التطبيق، فيفشل scanner.stop() عند العودة. وفشل stop() هو نفسه
    // الشرط الذي كان يترك صندوق الماسح عالقاً ويُميت زر الكاميرا نهائياً.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') stopAnyScanner();
    });
    window.addEventListener('pagehide', () => { stopAnyScanner(); });

    // ===== تسجيل الدخول =====

        loginBtn.disabled = false; loginBtnText.textContent = 'دخول';

      bugBtn.style.display = 'block';
      headerTitle.textContent = "أهلاً، " + currentUser.name;
      // الإصدار كان يظهر في شاشة الدخول فقط، والمندوب لا يراها إلا عند أول دخول
      // (الجلسة محفوظة في localStorage). عرضه في الترويسة يجعله مقروءاً في أي لحظة
      // — وهو الطريقة الوحيدة للتأكد أن التحديث وصل ولم يخدمه الـWebView من الكاش.
      headerSub.textContent = "إدارة الطلبات والتسليمات · إصدار " + APP_VERSION;
      loadDashboardStats();
    }

    function logout() {
      stopAnyScanner();
      localStorage.removeItem('mamelon_delegate_user');
      // نسخة السلة تخص مندوباً بعينه — لا تُترك لمن يدخل بعده على نفس الجهاز.
      localStorage.removeItem(CART_SNAPSHOT_KEY);
      currentUser = null;
      location.reload();
    }

    // ===== الداشبورد =====
    async function loadDashboardStats() {
      try {
        // ‼️ الحيازة مصدرها `current_holder` وحده لا `status`. الفلتر القديم كان
        // يشترط status=out_for_delivery، فأي مسار في برنامج المعمل يعيد الحالة إلى
        // "جاهزة" (مراجعة تاريخ حفر مثلاً) كان يُسقطها من العدّاد ومن السلة معاً
        // بينما هي في يد المندوب فعلاً — لا عدد ولا سجل (بلاغ 29 أغسطس 2026).
        // ⛔ واستثناء `delivered` أُزيل 9 سبتمبر 2026 (ADR-C11) — العدّاد يجب أن يطابق
        // فلتر `loadCart` حرفاً بحرف، وإلا قال «3» والسلة تعرض 4 فيفقد المندوب ثقته بالاثنين.
        const inCartRes = await getJson(`${CASES_URL}?current_holder=eq.${encodeURIComponent(currentUser.name)}&select=case_number`);
        const inCart = await inCartRes.json();
        // العدّ بأرقام الحالات لا بالصفوف — أمر الشغل الواحد قد يكون عدة مواد،
        // والسلة تعرضه بندًا واحداً، فالعدّاد لازم يطابق ما تراه العين.
        const inCartCount = new Set((inCart || []).map(r => r.case_number)).size;
        dashCart.textContent = inCartCount;
        cartCountEl.textContent = inCartCount;
      } catch (err) { }

      try {
        const todayStart = new Date().toISOString().split('T')[0] + 'T00:00:00';
        const deliveredRes = await getJson(`${DELIVERIES_URL}?delegate_name=eq.${encodeURIComponent(currentUser.name)}&delivered_at=gte.${todayStart}&select=id`);
        const delivered = await deliveredRes.json();
        dashDelivered.textContent = delivered.length || 0;
        todayCountEl.textContent = delivered.length || 0;
      } catch (err) { }

      try {
        const returnedRes = await getJson(`${RETURNS_URL}?delegate_name=eq.${encodeURIComponent(currentUser.name)}&select=id`);
        const returned = await returnedRes.json();
        dashReturned.textContent = returned.length || 0;
        returnedCountEl.textContent = returned.length || 0;
      } catch (err) { }
    }

    // ===== البحث (تبويب استلام حالة) =====
    // نواة البحث المشتركة: تبحث عن الحالة وتضيفها لقائمة الالتقاط، وترجّع نتيجة
    // موصوفة بدل ما تعرض تنبيهاً بنفسها. السبب: المسح المتتالي لا يحتمل alert()
    // لأنه يوقف الكاميرا ويعطّل التدفق، فيحتاج يعرض إشعاراً غير معطِّل بدلاً منه.
    async function lookupAndStageCase(caseNumber) {
      const url = `${CASES_URL}?case_number=eq.${encodeURIComponent(caseNumber)}&select=id,case_number,clinic_name,patient_name,product_type,current_holder,status`;
      const res = await getJson(url);
      const rows = await res.json();
      if (!rows || rows.length === 0) return { status: 'not_found', caseNumber };
      const c = groupByCaseNumber(rows)[0];
      if (c.current_holder) {
        return c.current_holder === currentUser.name
          ? { status: 'already_mine', caseNumber }
          : { status: 'held_by_other', caseNumber, holder: c.current_holder };
      }
      if (fetchedCases.has(c.case_number)) return { status: 'already_staged', caseNumber };
      fetchedCases.set(c.case_number, c);
      selectedForPickup.add(c.case_number);
      renderSearchedCases();
      updatePickupBar();
      return { status: 'added', caseNumber };
    }

    async function searchCase() {
      const val = searchInput.value.trim();
      if (!val) { alert("اكتب رقم الحالة الأول"); return; }
      searchBtn.disabled = true;
      searchBtn.innerHTML = '<span class="spinner dark"></span>';
      try {
        const r = await lookupAndStageCase(val);
        if (r.status === 'not_found') alert(`مفيش حالة برقم "${val}"، تأكد من الرقم`);
        else if (r.status === 'already_mine') alert("الحالة دي موجودة في سلتك بالفعل");
        else if (r.status === 'held_by_other') alert(`الحالة دي حالياً مع المندوب: ${r.holder}`);
        else searchInput.value = '';
      } catch (err) {
        alert("مشكلة في الاتصال، جرب تاني");
      }
      searchBtn.disabled = false;
      searchBtn.textContent = 'دوّر';
    }

    function groupByCaseNumber(rows) {
      const map = new Map();
      rows.forEach(r => {
        if (!map.has(r.case_number)) map.set(r.case_number, { ...r, products: new Set() });
        if (r.product_type) map.get(r.case_number).products.add(r.product_type);
      });
      return [...map.values()];
    }

    function renderSearchedCases() {
      if (fetchedCases.size === 0) {
        availableList.innerHTML = '<div class="empty-state">ادخل رقم الحالة أو استخدم الكاميرا لمسح الباركود 📦</div>';
        return;
      }
      availableList.innerHTML = '';
      fetchedCases.forEach(c => {
        const el = document.createElement('div');
        el.className = 'case-item';
        const isChecked = selectedForPickup.has(c.case_number) ? 'checked' : '';
        el.innerHTML = `
      <div class="case-item-top">
        <div>
          <div class="case-num">${escapeHtml(c.case_number)}</div>
          <div class="case-clinic">${escapeHtml(c.clinic_name || '—')} · ${escapeHtml(c.patient_name || '—')}</div>
        </div>
        <div class="item-actions-right">
          <button class="remove-case-btn" data-case="${escapeHtml(c.case_number)}">✖</button>
          <div class="checkbox ${isChecked}" data-case="${escapeHtml(c.case_number)}"></div>
        </div>
      </div>
      <div class="case-products">${[...c.products].map(p => `<span class="chip">${escapeHtml(p)}</span>`).join('')}</div>
      <div class="product-picker" style="margin-top:8px;">${PRODUCTS.map(p => `<div class="product-chip${pendingProducts[c.case_number] === p ? ' active' : ''}" data-product="${escapeHtml(p)}">${escapeHtml(p)}</div>`).join('')}</div>
    `;
        el.querySelector('.remove-case-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          const cn = e.currentTarget.dataset.case;
          fetchedCases.delete(cn);
          selectedForPickup.delete(cn);
          clearPendingProduct(cn);
          renderSearchedCases();
          updatePickupBar();
        });
        el.querySelector('.checkbox').addEventListener('click', (e) => {
          const box = e.currentTarget;
          const cn = box.dataset.case;
          if (selectedForPickup.has(cn)) { selectedForPickup.delete(cn); box.classList.remove('checked'); }
          else { selectedForPickup.add(cn); box.classList.add('checked'); }
          updatePickupBar();
        });
        el.querySelectorAll('.product-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            el.querySelectorAll('.product-chip').forEach(x => x.classList.remove('active'));
            chip.classList.add('active');
            savePendingProduct(c.case_number, chip.dataset.product);
          });
        });
        availableList.prepend(el);
      });
    }

    function updatePickupBar() {
      selectedCountEl.textContent = selectedForPickup.size;
      pickupBar.classList.toggle('show', selectedForPickup.size > 0);
    }

    // يحاول حجز حالة واحدة. يرجّع وصفاً للنتيجة بدل تعديل حالة مشتركة مباشرةً،
    // عشان النداءات تقدر تتنفذ بالتوازي بأمان ثم تُجمَّع نتائجها بالترتيب.
    async function claimCase(caseNumber) {
      try {
        // ‼️ الحائز وحده يمنع الالتقاط — لا الحالة (قرار المستخدم 9 سبتمبر 2026، ADR-C11).
        // ⛔ وشرط `status=eq.ready` **أُزيل عمداً ولا يُعاد**: كان يمنع المندوب من مسح حالة
        // في يده فعلاً لأن خانة `status` في القاعدة لا تطابق الواقع (حالات مُسلَّمة تظهر
        // «جاهزة»، وحالات جاهزة على الرفّ ما زالت `new` لأنها سُجِّلت برقم ثانٍ).
        // الثمن المقبول بوعي: عودة احتمال التقاط حالة لم تُحفَر بعد (كان 11478 و11499).
        // ويبقى الشرط في القاعدة لا في الواجهة حتى لا تُوجد فجوة يلتقط فيها مندوبان
        // الحالة نفسها — وهذا هو الحارس الوحيد الباقي.
        const url = `${CASES_URL}?case_number=eq.${encodeURIComponent(caseNumber)}&current_holder=is.null`;
        const res = await fetch(url, {
          method: 'PATCH',
          headers: { ...headers, "Prefer": "return=representation" },
          body: JSON.stringify({ status: 'out_for_delivery', current_holder: currentUser.name, picked_up_at: new Date().toISOString() })
        });
        // نجاح الكتابة يُحدَّد من حالة HTTP أولاً، لا من قراءة الجسم: لو الاستجابة
        // اتقبلت (2xx) لكن قراءة JSON فشلت (انقطاع لحظي/جسم مشوَّه)، فالصف اتحدَّث
        // فعلاً — فلازم نحذفه من قائمة "المتاحة" وإلا يفضل ظاهر كأنه لسه متاح.
        if (!res.ok) return { caseNumber, claimed: false, blocked: false };
        let rowsUpdated = null;              // null = تعذّرت قراءة جسم الاستجابة
        try { rowsUpdated = await res.json(); } catch (e) { rowsUpdated = null; }
        if (rowsUpdated === null || rowsUpdated.length > 0) return { caseNumber, claimed: true, blocked: false };
        // مصفوفة فاضية ≠ فشل قراءة: الفاضية تعني الفلتر (current_holder=is.null)
        // ما طابقش أي صف، أي أن الحالة محجوزة أصلاً لشخص ما.
        return { caseNumber, claimed: false, blocked: true };
      } catch (err) {
        return { caseNumber, claimed: false, blocked: false };
      }
    }

    // الرسالة القديمة كانت تتهم "مندوب تاني" دائماً حتى لو الحالة مع المندوب نفسه.
    // استعلام مجمَّع واحد يحدد الحائز الفعلي فيُعرَض سبب دقيق قابل للتصرف.
    async function describePickupFailure(blocked) {
      if (blocked.length === 0) return "مقدرناش ناخد الحالات، جرب تاني";
      try {
        const inList = inFilterList(blocked);
        const res = await getJson(`${CASES_URL}?case_number=in.(${inList})&select=case_number,current_holder`);
        const rows = await res.json();
        const mine = [], others = new Map();
        (rows || []).forEach(r => {
          if (!r.current_holder) return;
          if (r.current_holder === currentUser.name) {
            if (!mine.includes(r.case_number)) mine.push(r.case_number);
          } else if (!others.has(r.case_number)) {
            others.set(r.case_number, r.current_holder);
          }
        });
        const parts = [];
        if (mine.length) parts.push(`موجودة في سلتك بالفعل: ${mine.join('، ')}`);
        if (others.size) parts.push(`مع مندوب تاني: ${[...others].map(([cn, h]) => `${cn} (${h})`).join('، ')}`);
        return parts.length ? parts.join('\n') : "الحالات دي مش متاحة دلوقتي، جرب تاني";
      } catch (e) {
        return "الحالات دي مش متاحة دلوقتي، جرب تاني";
      }
    }

    async function confirmPickup() {
      pickupBtn.disabled = true;
      pickupBtnText.innerHTML = 'جاري النقل... <span class="spinner dark"></span>';
      // بالتوازي بدل التتابع: كل حالة رقمها مختلف فلا تعارض بينها، وكان الانتظار
      // التسلسلي يضرب رحلة شبكة كاملة × عدد الحالات (دفعة من 10 = 10 رحلات متتالية).
      const outcomes = await Promise.all([...selectedForPickup].map(claimCase));
      let successCount = 0;
      const blocked = [];
      outcomes.forEach(o => {
        if (o.claimed) { successCount++; fetchedCases.delete(o.caseNumber); }
        else if (o.blocked) blocked.push(o.caseNumber);
      });
      selectedForPickup.clear();
      updatePickupBar();
      renderSearchedCases();
      pickupBtn.disabled = false;
      pickupBtnText.textContent = `📦 خد المحدد للسلة`;
      if (successCount > 0) { switchTab('cart'); }
      else { alert(await describePickupFailure(blocked)); }
      await loadDashboardStats();
    }

    // ===== سلتي =====

    const CART_SNAPSHOT_KEY = 'mamelon_cart_snapshot';

    // ‼️ `products` مجموعة Set، و`JSON.stringify` يحوّل الـSet إلى `{}` بلا أي خطأ ظاهر —
    // أي أن السلة كانت ستُحفظ بلا منتجات إطلاقاً. التحويل لمصفوفة هنا وإعادة بنائها
    // Set عند القراءة شرطُ صحةٍ لا تحسين شكلي.
    function saveCartSnapshot(grouped) {
      try {
        localStorage.setItem(CART_SNAPSHOT_KEY, JSON.stringify({
          at: Date.now(),
          name: currentUser.name,
          cases: grouped.map(c => ({ ...c, products: [...c.products] }))
        }));
      } catch (err) { }
    }

    function readCartSnapshot() {
      try {
        const raw = localStorage.getItem(CART_SNAPSHOT_KEY);
        if (!raw) return null;
        const snap = JSON.parse(raw);
        // نسخة زميل على نفس الجهاز لا تُعرض لمندوب آخر.
        if (!snap || !Array.isArray(snap.cases) || snap.name !== currentUser.name) return null;
        return { at: snap.at, cases: snap.cases.map(c => ({ ...c, products: new Set(c.products || []) })) };
      } catch (err) { return null; }
    }

    // 7.2 — مدة بقاء الحالة في يد المندوب. ترجّع null إذا لم يكن هناك تاريخ التقاط،
    // فشارة كاذبة أسوأ من غياب الشارة.
    function timeInHandBadge(pickedUpAt, now = Date.now()) {
      if (!pickedUpAt) return null;
      const t = new Date(pickedUpAt).getTime();
      if (!Number.isFinite(t)) return null;
      const hours = Math.max(0, (now - t) / 3600000);
      const days = Math.floor(hours / 24);
      if (days < 1) return { tone: 'age-fresh', label: hours < 1 ? 'معاك من أقل من ساعة' : `معاك من ${Math.floor(hours)} ساعة` };
      if (days === 1) return { tone: 'age-mid', label: 'معاك من يوم' };
      if (days === 2) return { tone: 'age-mid', label: 'معاك من يومين' };
      return { tone: 'age-old', label: `معاك من ${days} ${days <= 10 ? 'أيام' : 'يوم'}` };
    }

    // 7.1 — الحيازة مصدرها `current_holder` (ADR-C08)، فالحالة تبقى ظاهرة مهما عبث بها
    // المعمل. هذه الشارة تجعل ذلك العبث **مرئياً** بدل أن يكون صامتاً كما حصل في 29 أغسطس.
    function staleStateBadge(status) {
      if (!status || status === 'out_for_delivery') return null;
      return { tone: 'warn', label: '⚠️ المعمل عدّل الحالة' };
    }

    function buildCaseBadges(c) {
      const badges = [staleStateBadge(c.status), timeInHandBadge(c.picked_up_at)].filter(Boolean);
      if (badges.length === 0) return '';
      return `<div class="case-badges">${badges.map(b => `<span class="case-badge ${b.tone}">${escapeHtml(b.label)}</span>`).join('')}</div>`;
    }

    async function loadCart() {
      cartList.innerHTML = '<div class="empty-state">جاري التحميل...</div>';
      selectedForDelivery.clear();
      selectedClinic = null;
      updateBatchToolbar();
      try {
        // ‼️ `current_holder` وحده يحدد ما في يد المندوب — بلا أي شرط على `status` إطلاقاً
        // (ADR-C11، 9 سبتمبر 2026). ⛔ واستثناء `delivered` أُزيل هو الآخر: لو كتب المعمل
        // «مُسلَّمة» على حالة ما زالت في يد المندوب، اختفاؤها من سلته يجعله يحمل قطعة لا
        // يراها في التطبيق ولا يقدر يسلّمها. تسليمه هو نفسه يُفرّغ `current_holder` فتخرج
        // من السلة بالحائز لا بالحالة. status و picked_up_at للشارتين (7.1/7.2): كلاهما في
        // نفس الصف المجلوب أصلاً، فلا استعلام إضافي ولا حِمل على القاعدة.
        const url = `${CASES_URL}?current_holder=eq.${encodeURIComponent(currentUser.name)}&select=id,case_number,clinic_name,doctor_name,patient_name,product_type,status,picked_up_at&order=clinic_name.asc,case_number.asc`;
        const res = await getJson(url);
        const rows = await res.json();
        const grouped = groupByCaseNumber(rows);
        saveCartSnapshot(grouped);
        renderCart(grouped, { offline: false });
      } catch (err) {
        // لا شبكة: نعرض آخر سلة ناجحة محفوظة بدل شاشة فارغة — المندوب يدخل
        // عيادات في بدرومات ولازم يعرف على الأقل ماذا يحمل (7.5).
        const snap = readCartSnapshot();
        if (snap) renderCart(snap.cases, { offline: true, at: snap.at });
        else cartList.innerHTML = '<div class="empty-state">مشكلة في تحميل السلة</div>';
      }
    }

    // عرض السلة — مشتركة بين المسار المتصل والنسخة المحفوظة، فلا تتكرر حلقة العرض.
    // في وضع اللااتصال تُخفى أفعال التسليم/الإرجاع (class=readonly) لأنها لن تصل القاعدة.
    function renderCart(grouped, opts = {}) {
      const offline = Boolean(opts.offline);
      cartCountEl.textContent = grouped.length;
      if (grouped.length === 0) {
        cartList.innerHTML = '<div class="empty-state">سلتك فاضية — خد طلبات من تبويب البحث</div>';
        return;
      }
      cartList.innerHTML = '';
      if (offline) {
        const note = document.createElement('div');
        note.className = 'offline-note';
        const t = opts.at ? new Date(opts.at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';
        note.textContent = '⚠️ معروضة بدون اتصال' + (t ? ' — آخر تحديث ' + t : '');
        cartList.appendChild(note);
      }
      let lastClinic = null;
      grouped.forEach(c => {
        if (c.clinic_name !== lastClinic) {
          lastClinic = c.clinic_name;
          const header = document.createElement('div');
          header.className = 'clinic-header';
          header.textContent = '🏥 ' + (c.clinic_name || '—');
          cartList.appendChild(header);
        }

        const el = document.createElement('div');
        el.className = 'case-item' + (offline ? ' readonly' : '');
        el.dataset.casenum = c.case_number;
        cartCaseInfo.set(c.case_number, { patient: c.patient_name, doctor: c.doctor_name });
        // 7.7 — الفلترة صارت تشمل العيادة والطبيب والمريض لا رقم الحالة وحده.
        el.dataset.search = [c.case_number, c.clinic_name, c.doctor_name, c.patient_name]
          .filter(Boolean).join(' ').toLowerCase();
        const preselected = pendingProducts[c.case_number] || null;
        el.innerHTML = `
      <div class="case-item-top">
        <div>
          <div class="case-num">${escapeHtml(c.case_number)}</div>
          <div class="case-clinic">${escapeHtml(c.clinic_name || '—')} · ${escapeHtml(c.doctor_name || '—')}<br>${escapeHtml(c.patient_name || '—')}</div>
          ${buildCaseBadges(c)}
        </div>
        <div class="item-actions-right">
          <div class="checkbox" data-case="${escapeHtml(c.case_number)}" data-clinic="${escapeHtml(c.clinic_name || '')}"></div>
        </div>
      </div>
      <div class="case-products">${[...c.products].map(p => `<span class="chip">${escapeHtml(p)}</span>`).join('')}</div>
      <div class="product-picker" style="margin-top:8px;">${PRODUCTS.map(p => `<div class="product-chip${preselected === p ? ' active' : ''}" data-product="${escapeHtml(p)}">${escapeHtml(p)}</div>`).join('')}</div>
      <div class="case-actions">
        <button class="btn btn-green btn-sm deliver-open-btn">✅ تسليم</button>
        <button class="btn btn-red btn-sm return-btn">↩️ رجّع</button>
      </div>
      <div class="deliver-form">
        <input class="text-input recipient-input" placeholder="اسم المستلم في العيادة *" maxlength="100">
        <button class="btn btn-primary btn-sm confirm-deliver-btn" disabled>تأكيد التسليم</button>
      </div>
      <div class="return-form">
        <textarea class="text-input return-reason-input" placeholder="سبب الإرجاع (اختياري)" maxlength="200" style="min-height:60px;"></textarea>
        <button class="btn btn-red btn-sm confirm-return-btn">تأكيد الإرجاع</button>
        <div style="height:6px"></div>
        <button class="btn btn-ghost btn-sm cancel-return-btn">إلغاء</button>
      </div>
    `;

        let product = preselected;
        const form = el.querySelector('.deliver-form');
        const confirmBtn = el.querySelector('.confirm-deliver-btn');
        const recipientInput = el.querySelector('.recipient-input');
        const returnForm = el.querySelector('.return-form');
        const returnReasonInput = el.querySelector('.return-reason-input');
        const confirmReturnBtn = el.querySelector('.confirm-return-btn');
        const cancelReturnBtn = el.querySelector('.cancel-return-btn');
        const deliverOpenBtn = el.querySelector('.deliver-open-btn');
        const checkboxEl = el.querySelector('.checkbox');

        deliverOpenBtn.addEventListener('click', () => {
          form.classList.toggle('show');
          returnForm.classList.remove('show');
        });

        el.querySelectorAll('.product-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            el.querySelectorAll('.product-chip').forEach(x => x.classList.remove('active'));
            chip.classList.add('active');
            product = chip.dataset.product;
            savePendingProduct(c.case_number, product);
            checkDeliverEnabled();
          });
        });
        recipientInput.addEventListener('input', checkDeliverEnabled);
        function checkDeliverEnabled() { confirmBtn.disabled = !(product && recipientInput.value.trim().length > 0); }

        // --- صندوق اختيار الدفعة الجماعية ---
        checkboxEl.addEventListener('click', () => {
          const cn = checkboxEl.dataset.case, clinic = checkboxEl.dataset.clinic;
          if (selectedForDelivery.has(cn)) {
            selectedForDelivery.delete(cn);
            checkboxEl.classList.remove('checked');
            if (selectedForDelivery.size === 0) selectedClinic = null;
          } else {
            if (selectedClinic && selectedClinic !== clinic) return;
            selectedClinic = clinic;
            selectedForDelivery.add(cn);
            checkboxEl.classList.add('checked');
            form.classList.remove('show');
            returnForm.classList.remove('show');
          }
          deliverOpenBtn.disabled = selectedForDelivery.has(cn);
          applyClinicLock();
          updateBatchToolbar();
        });

        // --- تأكيد التسليم مع إرسال إشعار تليجرام ---
        confirmBtn.addEventListener('click', async () => {
          confirmBtn.disabled = true;
          confirmBtn.textContent = '...جاري التسجيل';
          const recipientName = recipientInput.value.trim();
          // لحظة واحدة تُكتب في `cases.delivery_date` وفي `deliveries.delivered_at` معاً، فلا
          // يفترقان بأجزاء الثانية ويصير الربط بينهما دقيقاً في أي تقرير لاحق (نفس نمط الـERP).
          const now = new Date().toISOString();
          try {
            // ⚠️ الترتيب مقصود: **تحديث الحالة أولاً، ثم سجل التسليم** — نفس ما استقرّ عليه
            // الـERP في ADR-024 هناك. بالترتيب المعكوس، فشلُ الـ`PATCH` بعد نجاح الـ`POST`
            // يترك **سجل تسليم لحالة لم تُسلَّم**، وإعادة المحاولة تُنتج سجلاً ثانياً مكرَّراً.
            // ⛔ وفشل سجل التسليم بعده لا يعكس التحديث: الحالة سُلِّمت فعلاً (نُبلِّغ ولا نتراجع).
            await writeJson(`${CASES_URL}?case_number=eq.${encodeURIComponent(c.case_number)}`, 'PATCH', {
              status: 'delivered',
              current_holder: null,
              picked_up_at: null,
              // ⚠️ كانا ناقصين تماماً: التسليم اليدوي من الـERP يكتبهما بينما تطبيق المندوب لا،
              // فكانت **كل** تسليمات المندوبين تظهر في الـERP بتاريخ تسليم فارغ (بلاغ 8 سبتمبر 2026).
              delivery_date: now,
              recipient_name: recipientName
            });
            try {
              await writeJson(DELIVERIES_URL, 'POST', {
                case_number: c.case_number, delivery_stage: product, delivered_at: now,
                recipient_name: recipientName, delegate_name: currentUser.name
              });
            } catch (logErr) {
              alert(`تم تسجيل تسليم الحالة ${c.case_number}، لكن ما انكتبتش في سجل التسليمات.
بلّغ المعمل بالرقم ده.`);
            }

            // 📲 إرسال إشعار التسليم للتليجرام
            const deliverMsg = `📦 <b>تسليم حالة جديد</b>\n\n` +
              `🔹 <b>رقم الحالة:</b> ${c.case_number}\n` +
              `🏥 <b>العيادة:</b> ${c.clinic_name || 'غير محدد'}\n` +
              `👤 <b>الطبيب:</b> ${c.doctor_name || 'غير محدد'}\n` +
              `👤 <b>المريض:</b> ${c.patient_name || 'غير محدد'}\n` +
              `🦷 <b>المنتج:</b> ${product}\n` +
              `🛵 <b>المندوب:</b> ${currentUser.name}\n` +
              `✍️ <b>المستلم:</b> ${recipientName}`;
            sendTelegramNotification(deliverMsg);

            clearPendingProduct(c.case_number);
            await loadCart();
            await loadDashboardStats();
          } catch (err) {
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'تأكيد التسليم';
            // ⛔ الحالة لم تتحرك ولا سجل كُتب (التحديث أول خطوة) — إعادة المحاولة آمنة تماماً.
            alert(`ما تمّش تسجيل التسليم — الحالة زي ما هي وتقدر تعيد المحاولة.\n\nالتفصيل: ${err.message || err}`);
          }
        });

        el.querySelector('.return-btn').addEventListener('click', () => {
          returnForm.classList.toggle('show');
          form.classList.remove('show');
        });
        cancelReturnBtn.addEventListener('click', () => { returnForm.classList.remove('show'); returnReasonInput.value = ''; });

        // --- تأكيد الإرجاع مع إرسال إشعار تليجرام ---
        confirmReturnBtn.addEventListener('click', async () => {
          confirmReturnBtn.disabled = true;
          confirmReturnBtn.textContent = '...جاري الإرجاع';
          const reason = returnReasonInput.value.trim();
          try {
            // ⚠️ هنا الترتيب معكوس عن التسليم **عن قصد**: سجل الإرجاع يحمل **السبب** الذي
            // كتبه المندوب ولا يوجد في أي مكان آخر، بينما «رجعت للمعمل» يعرفها المعمل بالعين.
            // فلو نجح الـ`PATCH` وفشل الـ`POST` ضاع السبب إلى الأبد. نُدرج السجل أولاً، وفشله
            // يوقف العملية كلها قبل أن تتحرك الحالة — والمندوب يعيد المحاولة بلا أثر جانبي.
            await writeJson(RETURNS_URL, 'POST', {
              case_number: c.case_number, delegate_name: currentUser.name, reason: reason || null
            });
            await writeJson(`${CASES_URL}?case_number=eq.${encodeURIComponent(c.case_number)}`, 'PATCH', {
              status: 'ready', current_holder: null, picked_up_at: null
            });

            // 📲 إرسال إشعار الإرجاع للتليجرام
            const returnMsg = `↩️ <b>إرجاع حالة للمعمل</b>\n\n` +
              `🔹 <b>رقم الحالة:</b> ${c.case_number}\n` +
              `🏥 <b>العيادة:</b> ${c.clinic_name || 'غير محدد'}\n` +
              `👤 <b>الطبيب:</b> ${c.doctor_name || 'غير محدد'}\n` +
              `👤 <b>المريض:</b> ${c.patient_name || 'غير محدد'}\n` +
              `💬 <b>سبب الإرجاع:</b> ${reason || 'لم يتم ذكر سبب'}\n` +
              `🛵 <b>المندوب:</b> ${currentUser.name}`;
            sendTelegramNotification(returnMsg);

            await loadCart();
            await loadDashboardStats();
          } catch (err) {
            confirmReturnBtn.disabled = false;
            confirmReturnBtn.textContent = 'تأكيد الإرجاع';
            // قد يكون سجل الإرجاع دخل والـ`PATCH` هو الذي فشل ⇒ الحالة ما زالت في السلة.
            // إعادة المحاولة تُنتج سجل إرجاع ثانياً بنفس السبب — مقبول: تكرار في السجل
            // أهون من حالة ترجع للمعمل بلا سبب مكتوب، والسبب هو كل قيمة هذا السجل.
            alert(`ما تمّش تسجيل الإرجاع — الحالة لسه في سلتك.\n\nالتفصيل: ${err.message || err}`);
          }
        });

        cartList.appendChild(el);
      });
    }

    // ===== تبويب الحالات المرجعة =====
    async function loadReturned() {
      returnedList.innerHTML = '<div class="empty-state">جاري التحميل...</div>';
      try {
        const url = `${RETURNS_URL}?delegate_name=eq.${encodeURIComponent(currentUser.name)}&order=returned_at.desc&select=case_number,reason,returned_at`;
        const res = await getJson(url);
        const rows = await res.json();

        returnedCountEl.textContent = rows.length;
        dashReturned.textContent = rows.length;

        if (rows.length === 0) {
          returnedList.innerHTML = '<div class="empty-state">مفيش حالات مرجعة لسه 👍</div>';
          return;
        }

        const caseNumbers = [...new Set(rows.map(r => r.case_number))];
        let caseInfoMap = {};
        if (caseNumbers.length > 0) {
          // رقم يحوي فاصلة أو قوساً كان يكسر فلتر in.() فيرجع PostgREST خطأ 400
          // يُبتلَع في catch ويسقط تبويب المرجعة كله — inFilterList يقتبس القيم بأمان.
          const infoUrl = `${CASES_URL}?case_number=in.(${inFilterList(caseNumbers)})&select=case_number,clinic_name,patient_name`;
          const infoRes = await getJson(infoUrl);
          const infoRows = await infoRes.json();
          infoRows.forEach(r => { caseInfoMap[r.case_number] = r; });
        }

        returnedList.innerHTML = '';
        rows.forEach(r => {
          const info = caseInfoMap[r.case_number] || {};
          const d = new Date(r.returned_at);
          const dateStr = d.toLocaleDateString('ar-EG', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
          const el = document.createElement('div');
          el.className = 'case-item';
          el.innerHTML = `
        <div class="case-item-top">
          <div>
            <div class="case-num">${escapeHtml(r.case_number)}</div>
            <div class="case-clinic">${escapeHtml(info.clinic_name || '—')} · ${escapeHtml(info.patient_name || '—')}</div>
          </div>
        </div>
        <div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">🕒 ${escapeHtml(dateStr)}</div>
        ${r.reason ? `<div style="font-size:12.5px; color:var(--red); margin-top:6px;">💬 ${escapeHtml(r.reason)}</div>` : ''}
      `;
          returnedList.appendChild(el);
        });
      } catch (err) {
        returnedList.innerHTML = '<div class="empty-state">مشكلة في تحميل المرتجعات</div>';
      }
    }

    // ===== تبويب سجل اليوم (7.4) =====
    // نفس استعلام عدّاد "تسليم اليوم" الموجود في loadDashboardStats، بـ select أوسع —
    // فالمندوب كان يرى الرقم ولا يستطيع رؤية مَن هم، ولا دليل في يده إن قال طبيب "لم أستلم".
    async function loadToday() {
      todayList.innerHTML = '<div class="empty-state">جاري التحميل...</div>';
      try {
        const todayStart = new Date().toISOString().split('T')[0] + 'T00:00:00';
        const url = `${DELIVERIES_URL}?delegate_name=eq.${encodeURIComponent(currentUser.name)}&delivered_at=gte.${todayStart}&order=delivered_at.desc&select=case_number,clinic_name,patient_name,recipient_name,delivered_at,delivery_stage`;
        const res = await getJson(url);
        const rows = await res.json();

        todayCountEl.textContent = rows.length;
        dashDelivered.textContent = rows.length;

        if (rows.length === 0) {
          todayList.innerHTML = '<div class="empty-state">مفيش تسليمات النهاردة لسه 📦</div>';
          return;
        }

        // ⚠️ عمودا clinic_name و patient_name في `deliveries` فارغان في 218 صفاً من 221
        // خلال آخر 30 يوماً — مسارا التسليم في التطبيق لا يكتبانهما أصلاً. فالسجل بلا
        // إثراء كان سيعرض «— · —» في كل سطر تقريباً. نجلب البيانات من `cases` بنفس
        // نمط loadReturned (inFilterList يحمي من الفاصلة والقوس داخل رقم الحالة).
        const caseNumbers = [...new Set(rows.map(r => r.case_number))];
        let caseInfoMap = {};
        if (caseNumbers.length > 0) {
          try {
            const infoRes = await getJson(`${CASES_URL}?case_number=in.(${inFilterList(caseNumbers)})&select=case_number,clinic_name,patient_name`);
            (await infoRes.json()).forEach(r => { caseInfoMap[r.case_number] = r; });
          } catch (err) { }   // الإثراء تحسين لا شرط — السجل يُعرض بدونه
        }

        todayList.innerHTML = '';
        rows.forEach(r => {
          const info = caseInfoMap[r.case_number] || {};
          const timeStr = new Date(r.delivered_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
          const el = document.createElement('div');
          el.className = 'case-item';
          el.innerHTML = `
        <div class="case-item-top">
          <div>
            <div class="case-num">${escapeHtml(r.case_number)}</div>
            <div class="case-clinic">${escapeHtml(r.clinic_name || info.clinic_name || '—')} · ${escapeHtml(r.patient_name || info.patient_name || '—')}</div>
          </div>
          <div class="chip">${escapeHtml(timeStr)}</div>
        </div>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">✍️ ${escapeHtml(r.recipient_name || '—')}</div>
        ${r.delivery_stage ? `<div class="case-products"><span class="chip">${escapeHtml(r.delivery_stage)}</span></div>` : ''}
      `;
          todayList.appendChild(el);
        });
      } catch (err) {
        todayList.innerHTML = '<div class="empty-state">مشكلة في تحميل سجل اليوم</div>';
      }
    }

    // ===== بلاغ عن مشكلة (7.3) =====
    // جدول bug_reports كان موجوداً في القاعدة بكل أعماله ومهملاً تماماً — بلاغ 29 أغسطس
    // وصل شفهياً وبعد ساعات، وهذا الزر يسجّله لحظتها بكامل سياقه التقني.
    let bugSeverity = 'normal';

    // اسم الشاشة بالعربية كما يراها المندوب — من يقرأ البلاغ في الإدارة يقرأ عربياً.
    const TAB_LABELS = { available: 'البحث', cart: 'سلتي', returned: 'مرجعة', today: 'اليوم' };

    function currentScreenName() {
      const active = Object.entries(TABS).find(([, t]) => t.btn.classList.contains('active'));
      return active ? (TAB_LABELS[active[0]] || active[0]) : 'شاشة الدخول';
    }

    function showBugMsg(text, isError) {
      bugMsg.textContent = text;
      bugMsg.classList.toggle('error', Boolean(isError));
      bugMsg.classList.add('show');
    }

    function closeBugPanel() {
      bugPanel.style.display = 'none';
      bugDescInput.value = '';
      bugMsg.classList.remove('show');
      bugSendBtn.disabled = true;
    }

    async function sendBugReport() {
      const description = bugDescInput.value.trim();
      if (!description) return;                 // description عمود NOT NULL في القاعدة
      bugSendBtn.disabled = true;
      bugSendBtn.textContent = 'جاري الإرسال...';
      try {
        const res = await fetch(BUG_REPORTS_URL, {
          method: 'POST',
          headers: { ...headers, "Prefer": "return=minimal" },
          body: JSON.stringify({
            description,
            severity: bugSeverity,
            app_version: APP_VERSION,
            reporter_name: currentUser ? currentUser.name : null,
            reporter_role: 'مندوب',
            device_name: (navigator.userAgent || '').slice(0, 200),
            screen: currentScreenName()
          })
        });
        if (!res.ok) throw new Error('insert failed');

        // الإشعار الفوري هو ما يحوّل الزر من سجل صامت إلى بلاغ يصل الإدارة لحظته.
        sendTelegramNotification(
          `🐞 <b>بلاغ من تطبيق المندوب</b>
` +
          `👤 <b>المُبلِّغ:</b> ${currentUser ? currentUser.name : '—'}
` +
          `⚠️ <b>الخطورة:</b> ${bugSeverity}
` +
          `📱 <b>الإصدار:</b> ${APP_VERSION} · <b>الشاشة:</b> ${currentScreenName()}
` +
          `💬 ${description}`
        );

        closeBugPanel();
        alert('وصل البلاغ ✅ شكراً — هيتراجع في أقرب وقت');
      } catch (err) {
        showBugMsg('البلاغ مبعتش — اتأكد من النت وجرب تاني', true);
      } finally {
        bugSendBtn.textContent = 'إرسال البلاغ';
        bugSendBtn.disabled = bugDescInput.value.trim().length === 0;
      }
    }

    bugBtn.addEventListener('click', () => {
      const opening = bugPanel.style.display === 'none';
      bugPanel.style.display = opening ? 'block' : 'none';
      if (opening) { bugMsg.classList.remove('show'); bugDescInput.focus(); }
    });
    bugCancelBtn.addEventListener('click', closeBugPanel);
    bugDescInput.addEventListener('input', () => { bugSendBtn.disabled = bugDescInput.value.trim().length === 0; });
    bugSendBtn.addEventListener('click', sendBugReport);
    bugSeverityPicker.querySelectorAll('.product-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        bugSeverityPicker.querySelectorAll('.product-chip').forEach(x => x.classList.remove('active'));
        chip.classList.add('active');
        bugSeverity = chip.dataset.severity;
      });
    });

    // ===== التبويبات =====
    // خريطة بدل سلسلة if/else: كل فرع كان يطفئ التبويبات الأخرى صراحةً، فمع التبويب
    // الرابع (7.4) كانت الاستدعاءات ستصير 16 وكل إضافة لاحقة تفتح باباً للنسيان.
    const TABS = {
      available: { btn: tabAvailable, container: availableContainer },
      cart: { btn: tabCart, container: cartContainer, load: () => loadCart() },
      returned: { btn: tabReturned, container: returnedContainer, load: () => loadReturned() },
      today: { btn: tabToday, container: todayContainer, load: () => loadToday() }
    };

    function switchTab(tab) {
      stopAnyScanner();
      const target = TABS[tab] ? tab : 'available';
      Object.entries(TABS).forEach(([name, t]) => {
        const active = name === target;
        t.btn.classList.toggle('active', active);
        t.container.style.display = active ? 'block' : 'none';
      });
      // شريط الالتقاط يخص تبويب البحث وحده.
      if (target === 'available') pickupBar.classList.toggle('show', selectedForPickup.size > 0);
      else pickupBar.classList.remove('show');
      if (TABS[target].load) TABS[target].load();
    }

    tabAvailable.addEventListener('click', () => switchTab('available'));
    tabCart.addEventListener('click', () => switchTab('cart'));
    tabReturned.addEventListener('click', () => switchTab('returned'));
    tabToday.addEventListener('click', () => switchTab('today'));
    loginBtn.addEventListener('click', login);
    pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    logoutBtn.addEventListener('click', logout);
    pickupBtn.addEventListener('click', confirmPickup);

    searchBtn.addEventListener('click', searchCase);
    // تبويب البحث = التقاط علب للسلة → مسح متتالي (الكاميرا تفضل مفتوحة).
    // تبويب السلة = فلترة القائمة الموجودة → مسح مفرد، المتتالي بلا معنى هناك.
    scanBtn.addEventListener('click', () => startScanner('reader', handleContinuousScan, { continuous: true }));
    scanDoneBtn.addEventListener('click', () => stopScanner('reader'));
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchCase(); });

    cartScanBtn.addEventListener('click', () => startScanner('cartReader', (code) => { cartSearchInput.value = code; cartSearchInput.dispatchEvent(new Event('input')); }));
    cartSearchInput.addEventListener('input', e => {
      const term = e.target.value.trim();
      const needle = term.toLowerCase();
      const items = cartList.querySelectorAll('.case-item');
      items.forEach(item => {
        // البحث على data-search (رقم + عيادة + طبيب + مريض)، مع الإبقاء على تمييز
        // التطابق التام لرقم الحالة لأن ماسح السلة يعتمد عليه.
        if (!term || (item.dataset.search || item.dataset.casenum).includes(needle)) {
          item.style.display = 'block';
          if (term && item.dataset.casenum === term) {
            item.classList.add('highlight');
            item.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else { item.classList.remove('highlight'); }
        } else { item.style.display = 'none'; }
      });
      // عنوان عيادة لم يبقَ تحته بند ظاهر يصير سطراً معلّقاً بلا معنى.
      cartList.querySelectorAll('.clinic-header').forEach(header => {
        let visible = false;
        for (let n = header.nextElementSibling; n && !n.classList.contains('clinic-header'); n = n.nextElementSibling) {
          if (n.classList.contains('case-item') && n.style.display !== 'none') { visible = true; break; }
        }
        header.style.display = visible ? 'block' : 'none';
      });
    });

    // ===== منطق التسليم الجماعي (الدفعة) =====
    function applyClinicLock() {
      cartList.querySelectorAll('.checkbox').forEach(box => {
        const isOther = selectedClinic && box.dataset.clinic !== selectedClinic;
        box.classList.toggle('disabled', Boolean(isOther));
      });
    }

    function checkBatchConfirmEnabled() {
      batchConfirmBtn.disabled = !(selectedForDelivery.size > 0 && batchRecipientInput.value.trim().length > 0);
    }

    function updateBatchToolbar() {
      batchSelectedCountEl.textContent = selectedForDelivery.size;
      batchClinicLabelEl.textContent = selectedClinic || '';
      deliverBatchBar.classList.toggle('show', selectedForDelivery.size > 0);
      checkBatchConfirmEnabled();
    }

    async function confirmBatchDelivery() {
      const recipientName = batchRecipientInput.value.trim();
      const caseNumbers = [...selectedForDelivery];
      const missing = caseNumbers.filter(cn => !pendingProducts[cn]);
      if (missing.length > 0) {
        alert("اختر نوع المنتج لهذه الحالات الأول: " + missing.join(', '));
        return;
      }
      batchConfirmBtn.disabled = true;
      batchConfirmBtnText.textContent = '...جاري التسجيل';
      const now = new Date().toISOString();
      try {
        // نفس ترتيب التسليم الفردي وللسبب نفسه: الحالة أولاً ثم السجل (ADR-C10).
        const inList = inFilterList(caseNumbers);
        await writeJson(`${CASES_URL}?case_number=in.(${inList})`, 'PATCH', {
          status: 'delivered', current_holder: null, picked_up_at: null,
          delivery_date: now, recipient_name: recipientName
        });
        try {
          await writeJson(DELIVERIES_URL, 'POST', caseNumbers.map(cn => ({
            case_number: cn, delivery_stage: pendingProducts[cn], delivered_at: now,
            recipient_name: recipientName, delegate_name: currentUser.name
          })));
        } catch (logErr) {
          alert(`تم تسجيل تسليم الدفعة، لكن ما انكتبتش في سجل التسليمات.
بلّغ المعمل بالأرقام: ${caseNumbers.join(', ')}`);
        }

        // سطر لكل حالة: الرقم · المريض · الطبيب · المنتج المختار عند التسليم (BR-C03) — كالرسالة الفردية.
        const NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
        const caseLines = caseNumbers.map((cn, i) => {
          const info = cartCaseInfo.get(cn) || {};
          return `${NUMS[i] || (i + 1) + '.'} <b>${escapeHtml(cn)}</b> · 👤 <b>المريض:</b> ${escapeHtml(info.patient || 'غير محدد')}` +
            ` · 👨‍⚕️ <b>الطبيب:</b> ${escapeHtml(info.doctor || 'غير محدد')} · 🦷 ${escapeHtml(pendingProducts[cn] || '—')}`;
        }).join('\n');
        const batchMsg = `📦 <b>تسليم دفعة حالات</b>\n\n` +
          `🏥 <b>العيادة:</b> ${escapeHtml(selectedClinic || 'غير محدد')}\n` +
          `🔹 <b>عدد الحالات:</b> ${caseNumbers.length}\n\n` +
          `${caseLines}\n\n` +
          `🛵 <b>المندوب:</b> ${escapeHtml(currentUser.name)}\n` +
          `✍️ <b>المستلم:</b> ${escapeHtml(recipientName)}`;
        sendTelegramNotification(batchMsg);

        caseNumbers.forEach(clearPendingProduct);
        selectedForDelivery.clear();
        selectedClinic = null;
        batchRecipientInput.value = '';
        batchConfirmBtnText.textContent = 'تأكيد تسليم';
        await loadCart();
        await loadDashboardStats();
      } catch (err) {
        batchConfirmBtn.disabled = false;
        batchConfirmBtnText.textContent = 'تأكيد تسليم';
        // ⚠️ الـ`PATCH` الجماعي نداء واحد على القاعدة: إمّا نجح على كل الأرقام أو فشل عليها
        // كلها — فلا توجد دفعة نصف مُسلَّمة، وإعادة المحاولة آمنة.
        alert(`ما تمّش تسجيل تسليم الدفعة — الحالات زي ما هي وتقدر تعيد المحاولة.\n\nالتفصيل: ${err.message || err}`);
      }
    }

    batchRecipientInput.addEventListener('input', checkBatchConfirmEnabled);
    batchConfirmBtn.addEventListener('click', confirmBatchDelivery);

    if (currentUser) { enterHome(); }
  </script>
</body>

</html>
